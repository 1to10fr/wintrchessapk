name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the web app
        run: |
          npm install
          npm run build -w shared
          npm run build -w client

      - name: Collect web assets
        run: bash android-app/prepare-www.sh

      - name: Build the debug APK
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          # Opt out of Android's forced dark mode, which recolours the pieces
          sed -i '/<style name="AppTheme/a\        <item name="android:forceDarkAllowed">false</item>' \
            android/app/src/main/res/values/styles.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wintrchess-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
