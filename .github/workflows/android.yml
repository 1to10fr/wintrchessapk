name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

# Needed so a pushed version tag can publish a GitHub release
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the web app
        run: |
          npm install
          npm run build -w shared
          npm run build -w client

      - name: Collect web assets
        run: bash android-app/prepare-www.sh

      - name: Build the debug APK
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          # Opt out of Android's forced dark mode, which recolours the pieces
          sed -i '/<style name="AppTheme/a\        <item name="android:forceDarkAllowed">false</item>' \
            android/app/src/main/res/values/styles.xml
          # App version shown on the phone
          sed -i "s/versionCode 1\$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$(cat VERSION)\"/" \
            android/app/build.gradle
          # Allow vibration for move haptics
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>|' \
            android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wintrchess-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      # Publishes a release the first time a version in android-app/VERSION
      # is built, so bumping that file and pushing is all a release takes.
      # Release descriptions come from release-notes/<version>.md, and every
      # existing release gets its description refreshed from those files.
      - name: Publish release
        if: github.ref_type == 'branch' && github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat android-app/VERSION)"
          TAG="v$VERSION"
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk \
            "WintrChess-${TAG}.apk"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          elif [ -f "release-notes/$VERSION.md" ]; then
            gh release create "$TAG" "WintrChess-${TAG}.apk" \
              --target "$GITHUB_SHA" --title "WintrChess ${TAG}" \
              --notes-file "release-notes/$VERSION.md"
          else
            gh release create "$TAG" "WintrChess-${TAG}.apk" \
              --target "$GITHUB_SHA" --title "WintrChess ${TAG}" \
              --generate-notes
          fi

          for notes in release-notes/*.md; do
            NOTES_TAG="v$(basename "$notes" .md)"
            if gh release view "$NOTES_TAG" > /dev/null 2>&1; then
              gh release edit "$NOTES_TAG" --notes-file "$notes"
            fi
          done
